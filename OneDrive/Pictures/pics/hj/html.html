<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Input</title>
</head>

<body>

    <!-- Input field with placeholder -->
    <input type="text" id="nameInput" placeholder="Enter your name">

    <!-- H2 element to display the input dynamically -->
    <h2 id="displayHeading"></h2>

    <script>
        // Get the input and heading elements
        const nameInput = document.getElementById('nameInput');
        const displayHeading = document.getElementById('displayHeading');

        // Add input event listener to filter and display allowed characters
        nameInput.addEventListener('input', () => {
            // Get input value
            let inputText = nameInput.value;

            // Filter out characters that are not letters or spaces
            inputText = inputText.replace(/[^a-zA-Z ]/, '');

            // Update the heading with the filtered input
            displayHeading.textContent = inputText;

            // Set the filtered text back to the input (prevents disallowed characters from showing in the input box)
            nameInput.value = inputText;
        });
    </script>

</body>

</html>
